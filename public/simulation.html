<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northwind - Checkout</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17212b;background:#f4f7fa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
.shell{width:min(960px,100%);display:grid;grid-template-columns:1fr 1fr;gap:24px}
.panel{background:#fff;border:1px solid #dce3ea;border-radius:16px;padding:28px;box-shadow:0 12px 35px #17212b12}
.eyebrow{font-size:11px;letter-spacing:.12em;color:#687789;font-weight:700;text-transform:uppercase}
h1{font-size:27px;line-height:1.1;margin:8px 0 22px;text-align:center}h2{font-size:17px;margin:0}
.line{display:flex;justify-content:space-between;border-bottom:1px dashed #cdd6df;padding-bottom:18px}
.muted{color:#687789;font-size:13px}.total{display:flex;justify-content:space-between;font-weight:700;font-size:25px;padding:18px 0 24px}
.pay{border:0;border-radius:10px;padding:14px 18px;font-weight:700;cursor:pointer;width:100%;font-size:15px;background:#17212b;color:#fff}.pay:disabled{opacity:.55}
.status{margin-top:16px;color:#687789;font-size:13px;min-height:20px}.rows{display:grid;gap:8px;margin-top:18px}
.charge{display:flex;justify-content:space-between;gap:12px;border:1px solid #dce3ea;border-radius:10px;padding:13px}.charge.duplicate{border-color:#d6a63d;background:#fffaf0}
.charge code{font-size:11px;color:#536476}.charge small{display:block;color:#687789;margin-top:4px}.amount{text-align:right;font-weight:700}.ok{display:block;color:#176b4a;font-size:11px;margin-top:3px}
.hint{margin-top:20px;color:#536476;line-height:1.5;font-size:14px}
.customer-care{position:fixed;right:22px;bottom:22px;width:min(240px,calc(100vw - 36px));padding:13px 15px;border:1px solid #cbd7e2;border-radius:12px;background:#fff;box-shadow:0 10px 28px #17212b1c;z-index:4}
.customer-care p{margin:0 0 8px;color:#687789;font-size:12px;line-height:1.35}.refund{display:block;color:#176b4a;text-decoration:none;font-size:13px;font-weight:750}.refund:hover{text-decoration:underline}.refund:focus-visible{outline:2px solid #176b4a;outline-offset:3px}
@media(max-width:720px){.shell{grid-template-columns:1fr}.panel{padding:22px}}
</style>
</head>
<body>
<main class="shell">
  <section class="panel" aria-label="Payment checkout">
    <span class="eyebrow">Northwind payment demo</span>
    <h1>Renew your Pro plan</h1>
    <div class="line"><div><strong>Pro plan</strong><div class="muted">Monthly subscription</div></div><strong>$49.00</strong></div>
    <div class="total"><span>Total due</span><span>$49.00</span></div>
    <button class="pay" id="pay">Pay $49.00</button>
    <p class="status" id="status" role="status">Stripe test mode. No live card is accepted.</p>
  </section>
  <section class="panel" aria-label="Billing history">
    <span class="eyebrow">Billing history</span>
    <h2 style="margin-top:8px">Recent charges</h2>
    <div class="rows" id="rows"><p class="muted">No charges yet.</p></div>
  </section>
</main>
<aside class="customer-care" aria-label="Customer care">
  <p>Something look wrong with a charge?</p>
  <a class="refund" href="/?email=billing%40northwind.test&body=We%20were%20charged%20twice%20for%20our%20Pro%20plan.">Multiple charge? Ask for a refund</a>
</aside>
<script>
const pay=document.querySelector('#pay'), status=document.querySelector('#status'), rows=document.querySelector('#rows');
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'usd'}).format(n/100);
function show(c,i){if(i===0)rows.textContent='';const row=document.createElement('div');row.className='charge'+(i===1?' duplicate':'');row.innerHTML='<div><code></code><small>Pro plan · succeeded</small></div><div class="amount"></div>';row.querySelector('code').textContent=c.id;row.querySelector('.amount').innerHTML=money(c.amount)+'<span class="ok">SUCCEEDED</span>';rows.append(row)}
pay.onclick=async()=>{pay.disabled=true;status.textContent='Authorizing through Stripe test mode…';try{const r=await fetch('/api/simulation/payment',{method:'POST'}),data=await r.json();if(!r.ok)throw Error(data.error||'Payment failed');data.charges.forEach(show);status.textContent='Payment successful. Two charges were returned by Stripe.'}catch(e){status.textContent=e.message;pay.disabled=false}};
</script>
</body>
</html>
