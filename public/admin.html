<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F13">
<title>Billing Team — Warrant</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  .wrap{max-width:1360px}
  .shell{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0;min-height:calc(100vh - 62px)}
  @media(max-width:900px){.shell{grid-template-columns:1fr}.queue{border-right:0;border-bottom:1px solid var(--line)}}

  /* queue */
  .queue{border-right:1px solid var(--line);padding-block:20px;padding-inline:16px;background:#0D1319}
  .queue .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-inline:4px}
  .qitem{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;
    border-radius:9px;padding:11px 12px;margin-bottom:6px;color:var(--ink)}
  .qitem:hover:not(:disabled){background:var(--panel);border-color:var(--line2);color:var(--ink)}
  .qitem[aria-current="true"]{background:var(--panel2);border-color:var(--line2)}
  .qitem .l1{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .qitem .who{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .qitem .l2{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:12px;color:var(--ink3)}
  .qitem .said{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .count{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--warn)}

  /* detail */
  .detail{padding-block:24px 70px;padding-inline:clamp(18px,3vw,34px);min-width:0}
  .empty{display:grid;place-items:center;min-height:60vh;text-align:center;color:var(--ink3)}
  .dhead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
  .dhead h1{font-size:24px}
  .dhead .sub{color:var(--ink2);font-size:13.5px;margin-top:5px}
  .said-big{border-left:2px solid var(--line2);padding-left:14px;color:var(--ink2);font-size:15px;margin:14px 0 0;max-width:70ch}

  /* graph */
  .graphcard{padding:14px 10px 6px}
  .graphcard .cap{display:flex;justify-content:space-between;align-items:center;padding-inline:10px;margin-bottom:4px}
  .gscroll{overflow-x:auto}
  svg.graph{display:block;width:100%;min-width:880px;height:auto}
  .edge{fill:none;stroke:var(--line2);stroke-width:1.5}
  .edge.live{stroke:var(--read)}
  .edge.money{stroke:var(--money)}
  .edge.stop{stroke:var(--think)}
  .edge.fail{stroke:var(--bad)}
  .node rect{fill:var(--panel2);stroke:var(--line2);stroke-width:1}
  .node .t{fill:var(--ink3);font:600 12px "Instrument Sans",system-ui,sans-serif}
  .node .s{fill:var(--ink3);font:500 10.5px "IBM Plex Mono",monospace}
  .node .k{fill:var(--ink3);font:500 8.5px "IBM Plex Mono",monospace;letter-spacing:.12em}
  .node.idle{opacity:.55}
  .node.active rect{stroke:var(--read)}
  .node.active .t{fill:var(--ink)}
  .node.done rect{stroke:#2B4F66}
  .node.done .t{fill:var(--ink)}
  .node.done .s{fill:var(--ink2)}
  .node.think.done rect,.node.think.active rect{stroke:var(--think)}
  .node.money.done rect{stroke:var(--money);fill:#0B2A20}
  .node.gate.wait rect{stroke:var(--warn);fill:#241C0E}
  .node.gate.wait .t{fill:var(--warn)}
  .node.stop rect{stroke:var(--think);fill:#1A1230}
  .node.stop .t{fill:var(--think)}
  .node.fail rect{stroke:var(--bad);fill:#2A1413}
  .node.fail .t{fill:var(--bad)}
  .node.skipped rect{stroke-dasharray:4 3}
  .packet{fill:var(--read)}

  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-top:14px}

  /* decision */
  .decide{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
  @media(max-width:700px){.decide{grid-template-columns:1fr}}
  .decide .amt{font-family:"IBM Plex Mono",monospace;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
  .decide .why{color:var(--ink2);font-size:14px;margin:8px 0 0;max-width:62ch}
  .decide .acts{display:flex;gap:10px;flex-wrap:wrap}
  .expiry{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--warn);margin-top:10px}

  .kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;font-size:13.5px;margin:0}
  .kv dt{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding-top:3px}
  .kv dd{margin:0;min-width:0}

  .ev{display:grid;gap:8px}
  .evrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;
    padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#0E141A}
  .evrow.refund{border-color:#4A2220}
  .evrow.keep{border-color:#14503A}
  .src{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink3);border:1px solid var(--line2);border-radius:4px;padding:2px 6px}
  .evrow .what{min-width:0}
  .evrow .what .a{font-size:13.5px;font-weight:600}
  .evrow .what .b{font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .role{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;
    border-radius:20px;padding:2px 8px;white-space:nowrap}
  .role.r{color:var(--bad);border:1px solid #4A2220}
  .role.k{color:var(--money);border:1px solid #14503A}

  .reason{font-size:14px;color:var(--ink2);line-height:1.6;margin:0}
  .reason+.reason{margin-top:10px}
  .reason strong{color:var(--ink)}
  .telemetry{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .telemetry span{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3)}
  .telemetry b{color:var(--ink2);font-weight:500}
  .fallback{color:var(--warn)!important}

  .jrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
  .jrow:last-child{border-bottom:0}
  .jrow .op{font-size:13.5px}
  .jrow .op small{display:block;color:var(--ink3);font-size:11.5px;font-family:"IBM Plex Mono",monospace}

  .refs{display:grid;gap:8px}
  .refs a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;
    border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);font-size:13.5px;
    transition:border-color .16s ease,background-color .16s ease}
  .refs a:hover{border-color:var(--read);background:#0E1A22}
  .refs a span{color:var(--ink3);font-family:"IBM Plex Mono",monospace;font-size:11px}
  .refs .pending{padding:10px 12px;border:1px dashed var(--line2);border-radius:8px;color:var(--ink3);font-size:13px}

  .id[title]{cursor:help;border-bottom:1px dotted var(--line2)}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="/admin"><b translate="no">Warrant</b><span>Billing Team</span></a>
  <span class="spacer"></span>
  <span class="tag" id="t-model">model</span>
  <span class="tag" id="t-slack">slack</span>
  <span class="tag" id="t-lemma">lemma</span>
  <a class="navlink" href="/" target="_blank" rel="noopener">Customer view ↗</a>
</div></header>

<div class="shell">
  <nav class="queue" aria-label="Complaints">
    <div class="top"><span class="eyebrow">Complaints</span><span class="count" id="waiting"></span></div>
    <div id="queue"><p class="muted" style="padding:4px">No complaints yet. Submit one from the customer view.</p></div>
    <div style="padding:14px 4px 0"><button class="ghost" id="reset" style="font-size:12.5px;padding:7px 11px">Reset Demo Data</button></div>
  </nav>

  <main class="detail" id="detail">
    <div class="empty"><div><p class="eyebrow">Nothing selected</p>
      <p style="margin-top:8px">Pick a complaint to see the investigation.</p></div></div>
  </main>
</div>
<p class="vh" id="live" role="status" aria-live="polite"></p>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=(s)=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const money=(c,cur)=>c==null?'—':new Intl.NumberFormat(navigator.language||'en-US',{style:'currency',currency:(cur||'usd').toUpperCase()}).format(c/100);
/** ch_3UF2XjIa2TNAqGWf2JDgtYsH -> ch_3UF2…tYsH. Full value stays in the title. */
const short=(id,a=7,b=4)=>{ id=String(id??''); return id.length<=a+b+1?id:id.slice(0,a)+'…'+id.slice(-b); };
const sid=(id)=>`<span class="id" translate="no" title="${esc(id)}">${esc(short(id))}</span>`;
const ago=(iso)=>{ const s=Math.round((Date.now()-new Date(iso))/1000);
  return s<60?s+'s ago':s<3600?Math.round(s/60)+'m ago':Math.round(s/3600)+'h ago'; };

let motion=true;
gsap.matchMedia().add('(prefers-reduced-motion: reduce)',()=>{motion=false;});

const STATUS={
  received:['run','Received'], running:['run','Investigating'], awaiting_approval:['wait','Needs decision'],
  approved:['run','Approved'], executing:['run','Refunding'], complete:['go','Refunded'],
  partial:['wait','Refunded · partial'], refused:['no','No duplicate'], declined:['no','Declined'], error:['err','Error'],
};
const pill=(s)=>{ const [k,l]=STATUS[s]||['run',s]; return `<span class="pill ${k}">${esc(l)}</span>`; };

let selected=null, runId=null, es=null, snap=null, drawn=new Set();

/* ------------------------------------------------------------------ boot */
fetch('/api/config').then(r=>r.json()).then(c=>{
  $('#t-lemma').textContent=c.tracing?'lemma on':'lemma off'; $('#t-lemma').className='tag'+(c.tracing?' on':'');
  $('#t-slack').textContent=c.twin?'slack twin':'slack live'; $('#t-slack').className='tag'+(c.twin?' twin':' on');
  window.__repo=c.repo;
  $('#t-model').textContent=c.model||'model'; $('#t-model').className='tag on';
});

async function loadQueue(){
  const d=await fetch('/api/complaints').then(r=>r.json()).catch(()=>({complaints:[]}));
  const list=d.complaints||[];
  const waiting=list.filter(c=>c.status==='awaiting_approval').length;
  $('#waiting').textContent=waiting?waiting+' waiting':'';
  if(!list.length){ $('#queue').innerHTML='<p class="muted" style="padding:4px">No complaints yet. Submit one from the customer view.</p>'; return; }
  $('#queue').innerHTML=list.map(c=>`
    <button class="qitem" data-id="${esc(c.id)}" aria-current="${c.id===selected}">
      <div class="l1"><span class="who">${esc(c.customer_name||c.email)}</span>${pill(c.status)}</div>
      <div class="l2"><span class="said">${esc(c.body)}</span><span>${ago(c.created_at)}</span></div>
    </button>`).join('');
  $('#queue').querySelectorAll('.qitem').forEach(b=>b.onclick=()=>select(b.dataset.id,list));
  if(!selected){ const first=list.find(c=>c.status==='awaiting_approval')||list[0]; select(first.id,list); }
}
setInterval(loadQueue,2000); loadQueue();

function select(id,list){
  const c=(list||[]).find(x=>x.id===id); if(!c) return;
  if(selected===id) return;
  selected=id; runId=c.run_id; drawn=new Set(); snap=null;
  document.querySelectorAll('.qitem').forEach(b=>b.setAttribute('aria-current',b.dataset.id===id));
  renderShell(c);
  if(es) es.close();
  es=new EventSource('/api/events/'+runId);
  es.onmessage=e=>{ snap=JSON.parse(e.data); update(); };
}

/* ------------------------------------------------------------------ shell */
function renderShell(c){
  $('#detail').innerHTML=`
    <div class="dhead">
      <div>
        <p class="eyebrow">Complaint <span translate="no">${esc(c.id)}</span> · ${ago(c.created_at)}</p>
        <h1>${esc(c.customer_name||c.email)}</h1>
        <p class="sub">${esc(c.email)} · account ${sid(c.customer_id)}</p>
        <p class="said-big">“${esc(c.body)}”</p>
      </div>
      <div id="headpill">${pill(c.status)}</div>
    </div>

    <section class="card graphcard" aria-label="Investigation graph">
      <div class="cap"><span class="eyebrow">Investigation</span><span class="muted" id="gcap"></span></div>
      <div class="gscroll">${graphSVG()}</div>
    </section>

    <div id="decision"></div>

    <div class="grid2">
      <section class="card"><h2>Evidence</h2><div class="ev" id="evidence"><p class="muted">Gathering…</p></div></section>
      <section class="card"><h2>Model Reasoning</h2><div id="reasoning"><p class="muted">Waiting for the model…</p></div></section>
    </div>
    <div class="grid2">
      <section class="card"><h2>Operation Journal</h2><div id="journal"><p class="muted">No writes yet.</p></div>
        <p class="muted" style="margin:12px 0 0;font-size:12px">Intent is recorded before every external call. A succeeded write is never repeated.</p></section>
      <section class="card"><h2>References</h2><div class="refs" id="refs"></div></section>
    </div>`;
  gsap.from('#detail > *',{opacity:0,y:8,duration:motion?.35:0,stagger:motion?.05:0,ease:'power2.out'});
}

/* ------------------------------------------------------------------ graph
   Blocks connected by edges. Each node maps to one or more run steps. */
const W=128,H=56;
const NODES=[
  {id:'complaint',x:20, y:102,kind:'',     k:'CUSTOMER', t:'Complaint'},
  {id:'stripe',   x:190,y:40, kind:'',     k:'STRIPE',   t:'Charges',       step:'read_charges'},
  {id:'github',   x:190,y:164,kind:'',     k:'GITHUB',   t:'Incidents',     step:'read_incidents'},
  {id:'model',    x:360,y:102,kind:'think',k:'MODEL',    t:'Assess',        step:'assemble'},
  {id:'case',     x:530,y:40, kind:'',     k:'GITHUB',   t:'Case file',     step:'write_case'},
  {id:'notify',   x:530,y:164,kind:'',     k:'SLACK',    t:'Notify team',   step:'post_proposal'},
  {id:'gate',     x:700,y:102,kind:'gate', k:'HUMAN',    t:'Decision'},
  {id:'refund',   x:870,y:40, kind:'money',k:'STRIPE',   t:'Refund',        step:'refund'},
  {id:'verify',   x:870,y:164,kind:'',     k:'STRIPE',   t:'Verify',        step:'verify_refund'},
  {id:'close',    x:1040,y:102,kind:'',    k:'GITHUB · SLACK',t:'Close out', steps:['update_case','update_slack']},
];
const EDGES=[
  ['complaint','stripe'],['complaint','github'],['stripe','model'],['github','model'],
  ['model','case'],['model','notify'],['case','gate'],['notify','gate'],
  ['gate','refund'],['refund','verify'],['verify','close'],
];
const N=Object.fromEntries(NODES.map(n=>[n.id,n]));
function path(a,b){
  const A=N[a],B=N[b];
  if(A.x===B.x){ // vertical, same column
    const x=A.x+W/2; return `M${x},${A.y+H} L${x},${B.y}`; }
  const x1=A.x+W, y1=A.y+H/2, x2=B.x, y2=B.y+H/2, mx=(x1+x2)/2;
  return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
}
function graphSVG(){
  const edges=EDGES.map(([a,b])=>`<path class="edge" id="e-${a}-${b}" d="${path(a,b)}"/>`).join('');
  const nodes=NODES.map(n=>`
    <g class="node idle ${n.kind}" id="n-${n.id}" transform="translate(${n.x},${n.y})">
      <rect width="${W}" height="${H}" rx="9"/>
      <text class="k" x="12" y="17">${n.k}</text>
      <text class="t" x="12" y="33">${n.t}</text>
      <text class="s" x="12" y="47" id="s-${n.id}"></text>
    </g>`).join('');
  return `<svg class="graph" viewBox="0 0 1190 240" role="img" aria-label="Investigation flow">
    <g id="edges">${edges}</g><g id="packets"></g><g>${nodes}</g></svg>`;
}

function stepOf(key){ return (snap?.steps||[]).find(s=>s.key===key); }

/** Decide each node's visual state from the run. */
function nodeStates(s){
  const st={};
  st.complaint={state:'done',sub:'received'};
  const map=(id,key,sub)=>{ const x=stepOf(key); if(!x||x.state==='idle') return st[id]={state:'idle'};
    const last=x.attempts?.[x.attempts.length-1];
    st[id]={state:x.state==='refused'?'done':x.state, sub:sub(x), skipped:!!last?.skipped}; };

  map('stripe','read_charges',()=>{ const n=(s.finding?.evidence||[]).filter(e=>e.source==='stripe').length; return n?n+' charges':'reading'; });
  map('github','read_incidents',()=>{ const i=s.incidents||[]; return i.length?'#'+i[0].number:'none found'; });
  map('model','assemble',(x)=> x.state==='active'?'thinking…' : s.finding?.verdict==='duplicate'?'duplicate':'not duplicate');
  map('case','write_case',()=> s.caseNumber?'#'+s.caseNumber:'writing');
  map('notify','post_proposal',()=> s.finding?.verdict==='duplicate'?'proposal':'refusal');

  // The human gate.
  if(s.status==='refused'){ st.gate={state:'stop',sub:'not needed'}; }
  else if(s.status==='awaiting_approval'){ st.gate={state:'wait',sub:'awaiting you'}; }
  else if(s.status==='declined'){ st.gate={state:'stop',sub:'declined'}; }
  else if(s.plan && ['approved','executing','complete','partial'].includes(s.status)){ st.gate={state:'done',sub:'approved'}; }
  else st.gate={state:'idle'};

  map('refund','refund',(x)=> s.plan? money(s.plan.amount,s.plan.currency):'');
  map('verify','verify_refund',()=> 'amount matches');
  const u1=stepOf('update_case'), u2=stepOf('update_slack');
  if(u1||u2){
    const states=[u1,u2].filter(Boolean).map(x=>x.state);
    const state=states.includes('failed')?'fail':states.includes('active')?'active':states.every(x=>x==='done')?'done':'idle';
    st.close={state, sub: state==='fail'?'slack pending':state==='done'?'recorded':'updating'};
  } else st.close={state:'idle'};

  if(s.status==='refused'){ ['refund','verify','close'].forEach(k=>st[k]={state:'idle',sub:''}); }
  return st;
}

function paintGraph(){
  const s=snap; if(!s) return;
  const st=nodeStates(s);
  for(const n of NODES){
    const g=$('#n-'+n.id); if(!g) continue;
    const v=st[n.id]||{state:'idle'};
    const cls=['node',n.kind, v.state==='failed'?'fail':v.state, v.skipped?'skipped':''].filter(Boolean).join(' ');
    if(g.getAttribute('class')!==cls){
      g.setAttribute('class',cls);
      if(v.state!=='idle' && !drawn.has('n'+n.id+v.state) && motion){
        gsap.fromTo(g,{scale:.94,transformOrigin:'50% 50%'},{scale:1,duration:.45,ease:'back.out(2.2)'});
      }
      drawn.add('n'+n.id+v.state);
    }
    $('#s-'+n.id).textContent=v.sub||'';
  }
  for(const [a,b] of EDGES){
    const e=$(`#e-${a}-${b}`); if(!e) continue;
    const sa=st[a]?.state, sb=st[b]?.state;
    const lit = sa && sa!=='idle' && sb && sb!=='idle';
    let cls='edge';
    if(lit) cls+= b==='refund'||a==='refund' ? ' money' : sb==='stop' ? ' stop' : sb==='fail' ? ' fail' : ' live';
    if(e.getAttribute('class')!==cls){
      e.setAttribute('class',cls);
      if(lit && !drawn.has('e'+a+b)){
        drawn.add('e'+a+b);
        const len=e.getTotalLength();
        if(motion){
          gsap.fromTo(e,{strokeDasharray:len,strokeDashoffset:len},{strokeDashoffset:0,duration:.6,ease:'power2.inOut',
            onComplete:()=>gsap.set(e,{clearProps:'strokeDasharray,strokeDashoffset'})});
        }
      }
    }
    // A packet travels along any edge feeding a node that is working right now.
    if(motion && lit && sb==='active' && !e.dataset.flow) flow(e);
    if(sb!=='active') e.dataset.flow='';
  }
  $('#gcap').textContent = s.status==='awaiting_approval'?'Paused for your decision'
    : s.status==='refused'?'Stopped — no duplicate found'
    : s.status==='declined'?'Stopped — declined'
    : s.status==='complete'?'Complete'
    : s.status==='partial'?'Refund done · follow-up pending' : 'Working';
}

function flow(edge){
  edge.dataset.flow='1';
  const len=edge.getTotalLength();
  const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
  dot.setAttribute('r','3.5'); dot.setAttribute('class','packet');
  $('#packets').appendChild(dot);
  const o={t:0};
  gsap.to(o,{t:1,duration:.9,ease:'none',repeat:-1,
    onUpdate(){ if(!edge.dataset.flow){ this.kill(); dot.remove(); return; }
      const p=edge.getPointAtLength(o.t*len); dot.setAttribute('cx',p.x); dot.setAttribute('cy',p.y); }});
}

/* ------------------------------------------------------------------ panels */
let lastSig='';
function update(){
  const s=snap; if(!s) return;
  paintGraph();
  $('#headpill').innerHTML=pill(s.status);
  const sig=[s.status,!!s.finding,s.caseNumber,(s.pending||[]).length,
    (s.steps||[]).map(x=>x.state).join('')].join('|');
  if(sig===lastSig){ tickExpiry(s); return; }
  lastSig=sig;
  renderDecision(s); renderEvidence(s); renderReasoning(s); renderJournal(s); renderRefs(s);
  if(s.status==='awaiting_approval') $('#live').textContent='Decision needed for '+(s.plan?.customer_name||'this complaint');
}

function renderDecision(s){
  const box=$('#decision'); if(!box) return;
  let h='';
  if(s.status==='awaiting_approval' && s.plan){
    const p=s.plan;
    h=`<section class="card accent" style="margin-top:14px"><div class="decide">
      <div>
        <p class="eyebrow">Proposed correction</p>
        <div class="amt">${money(p.amount,p.currency)} <span class="muted" style="font-size:14px;font-family:inherit">full refund</span></div>
        <p class="why">Refund ${sid(p.charge_id)} as a duplicate of ${sid(p.duplicate_of)}.</p>
        <p class="expiry" id="expiry"></p>
      </div>
      <div class="acts">
        <button class="danger" id="decline">Decline</button>
        <button class="good" id="approve">Approve Refund</button>
      </div></div>
      <p class="muted" style="margin:14px 0 0;font-size:12px">Approval binds to plan ${sid(p.plan_id)}. If the evidence changes, this approval is void.</p>
    </section>`;
  } else if(s.status==='partial'){
    h=`<section class="card accent" style="margin-top:14px"><div class="decide">
      <div><p class="eyebrow">Refund complete · follow-up pending</p>
        <p class="why">${(s.pending||[]).map(p=>`<strong>${esc(p.step.replace('_',' '))}</strong> failed: ${esc(p.error)}`).join('<br>')}</p>
        <p class="muted" style="margin:8px 0 0;font-size:12.5px">The refund was not rolled back. Retrying only repeats the step that failed.</p></div>
      <div class="acts"><button class="primary" id="resume">Retry Follow-up</button></div></div></section>`;
  } else if(s.status==='complete'){
    h=`<section class="card good" style="margin-top:14px"><p class="eyebrow">Resolved</p>
      <p class="why" style="margin-top:6px">${money(s.plan?.amount,s.plan?.currency)} refunded and verified against Stripe. Approved by ${esc(s.approver||'the billing team')}.</p></section>`;
  } else if(s.status==='refused'){
    h=`<section class="card" style="margin-top:14px;border-color:#3B2A5C"><p class="eyebrow">Closed without action</p>
      <p class="why" style="margin-top:6px">The agent found no duplicate and asked for nothing. No decision was needed and no money moved.</p></section>`;
  } else if(s.status==='declined'){
    h=`<section class="card bad" style="margin-top:14px"><p class="eyebrow">Declined</p>
      <p class="why" style="margin-top:6px">You declined the proposed refund. The customer has been told no refund was issued.</p></section>`;
  }
  box.innerHTML=h;
  if(h && motion) gsap.from(box.firstElementChild,{opacity:0,y:8,duration:.35,ease:'power2.out'});

  const ap=$('#approve'), dc=$('#decline'), rs=$('#resume');
  if(ap) ap.onclick=async e=>{ lock(e,'Approving…'); await fetch('/api/approve/'+runId,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approver:'ops@warrant.test',plan_id:s.plan.plan_id})}); };
  if(dc) dc.onclick=async e=>{ lock(e,'Declining…'); await fetch('/api/decline/'+runId,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approver:'ops@warrant.test'})}); };
  if(rs) rs.onclick=async e=>{ lock(e,'Retrying…'); await fetch('/api/resume/'+runId,{method:'POST'}); };
  tickExpiry(s);
}
function lock(e,label){ document.querySelectorAll('.acts button').forEach(b=>b.disabled=true); e.currentTarget.textContent=label; }

function tickExpiry(s){
  const el=$('#expiry'); if(!el||s.expiresIn==null) return;
  const n=s.expiresIn; el.textContent=`Approval window closes in ${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;
}
setInterval(()=>{ if(snap&&snap.expiresIn>0&&snap.status==='awaiting_approval'){ snap.expiresIn--; tickExpiry(snap);} },1000);

function renderEvidence(s){
  const box=$('#evidence'); if(!box) return;
  const f=s.finding;
  if(!f){ box.innerHTML='<p class="muted">Gathering…</p>'; return; }
  const rows=(f.evidence||[]).map(e=>{
    const r=e.id===f.charge_to_refund, k=e.id===f.duplicate_of;
    const [a,...rest]=String(e.detail||'').split('·');
    return `<div class="evrow ${r?'refund':k?'keep':''}">
      <span class="src">${esc(e.source)}</span>
      <div class="what"><div class="a">${sid(e.id)} ${esc(a)}</div><div class="b">${esc(rest.join('·').trim())}</div></div>
      ${r?'<span class="role r">refund</span>':k?'<span class="role k">keep</span>':'<span></span>'}
    </div>`;
  });
  const inc=(s.incidents||[]).slice(0,2).map(i=>`<div class="evrow">
      <span class="src">github</span>
      <div class="what"><div class="a">#${i.number}</div><div class="b">${esc(i.title)}</div></div><span></span></div>`);
  box.innerHTML=[...rows,...(f.evidence||[]).some(e=>e.source==='github')?[]:inc].join('') || '<p class="muted">No evidence recorded.</p>';
}

function renderReasoning(s){
  const box=$('#reasoning'); if(!box) return;
  const f=s.finding, l=s.llm;
  if(!f){ box.innerHTML='<p class="muted">Waiting for the model…</p>'; return; }
  const verdict=f.verdict==='duplicate'?'<span class="pill go">Duplicate</span>':'<span class="pill no">Not a duplicate</span>';
  box.innerHTML=`<p style="margin:0 0 12px">${verdict}</p>
    <p class="reason">${esc(shortenIds(f.grounds))}</p>
    ${f.missing_evidence?`<p class="reason"><strong>Missing:</strong> ${esc(shortenIds(f.missing_evidence))}</p>`:''}
    ${f.uncertainty&&f.uncertainty!=='none'?`<p class="reason"><strong>Uncertain:</strong> ${esc(shortenIds(f.uncertainty))}</p>`:''}
    ${l?`<div class="telemetry">
      <span class="${l.rules?'fallback':''}"><b>${esc(l.rules?'Rules fallback':l.model)}</b></span>
      <span><b>${(l.ms/1000).toFixed(1)}s</b> reasoning</span>
      <span><b>${l.inTok}</b> in · <b>${l.outTok}</b> out tokens</span></div>`:''}`;
}
/** Long provider ids inside model prose become short tokens too. */
function shortenIds(t){ return String(t||'').replace(/`?\b((?:ch|cus|re|pi)_[A-Za-z0-9]{12,})\b`?/g,(_,id)=>short(id)); }

async function renderJournal(s){
  const box=$('#journal'); if(!box) return;
  if(!s.plan){ box.innerHTML=`<p class="muted">${s.status==='refused'?'No external writes — nothing was executed.':'No writes yet.'}</p>`; return; }
  const j=await fetch('/api/journal/'+runId).then(r=>r.json()).catch(()=>({operations:[]}));
  const ops=j.operations||[];
  if(!ops.length){ box.innerHTML='<p class="muted">Nothing executed yet. Waiting for a decision.</p>'; return; }
  const NAMES={refund:'Refund issued',update_case:'Case updated',update_slack:'Team notified'};
  box.innerHTML=ops.map(o=>{
    const cls=o.status==='succeeded'?'go':o.status==='failed'?'err':'wait';
    let res=''; try{ const r=JSON.parse(o.result||'null'); res=r?.id?short(r.id):''; }catch{}
    return `<div class="jrow"><div class="op">${esc(NAMES[o.step]||o.step)}<small>${esc(res||o.error||'')}</small></div>
      <span class="pill ${cls}">${esc(o.status)}</span></div>`;
  }).join('');
}

async function renderRefs(s){
  const box=$('#refs'); if(!box) return;
  const items=[];
  if(s.caseNumber&&window.__repo) items.push(`<a href="https://github.com/${window.__repo}/issues/${s.caseNumber}" target="_blank" rel="noopener">GitHub case file<span>#${s.caseNumber} ↗</span></a>`);
  items.push(`<a href="https://app.slack.com" target="_blank" rel="noopener">Slack thread<span>#billing-approvals ↗</span></a>`);
  items.push(`<div id="lemmarefs"><div class="pending">Lemma traces indexing…</div></div>`);
  box.innerHTML=items.join('');
  resolveTraces();
}
let traceTimer=null;
async function resolveTraces(tries=0){
  clearTimeout(traceTimer);
  const box=$('#lemmarefs'); if(!box||!runId) return;
  const r=await fetch('/api/tracelinks/'+runId).then(x=>x.json()).catch(()=>({}));
  const out=[];
  if(r.investigate) out.push(`<a href="${r.investigate}" target="_blank" rel="noopener">Lemma · investigation trace<span>↗</span></a>`);
  if(r.execute) out.push(`<a href="${r.execute}" target="_blank" rel="noopener">Lemma · execution trace<span>↗</span></a>`);
  if(out.length){ box.innerHTML=out.join(''); if(!r.execute&&snap?.plan&&['complete','partial'].includes(snap.status)) traceTimer=setTimeout(()=>resolveTraces(0),4000); return; }
  if(tries<40){ box.innerHTML=`<div class="pending">Lemma traces indexing… ${tries*3}s</div>`; traceTimer=setTimeout(()=>resolveTraces(tries+1),3000); }
  else box.innerHTML=`<a href="https://platform.uselemma.ai" target="_blank" rel="noopener">Lemma dashboard<span>↗</span></a>`;
}

$('#reset').onclick=async e=>{ e.currentTarget.disabled=true; e.currentTarget.textContent='Resetting…';
  await fetch('/api/reset',{method:'POST'}); location.reload(); };
</script>
</body>
</html>
